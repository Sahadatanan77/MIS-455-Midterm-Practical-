<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="micBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#micBg)"/>

  <!-- Desktop Stand Base -->
  <ellipse cx="200" cy="245" rx="55" ry="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="195" y="180" width="10" height="65" fill="#64748b"/>

  <!-- Shockmount ring -->
  <circle cx="200" cy="140" r="45" fill="none" stroke="#8b5cf6" stroke-width="3"/>
  <circle cx="200" cy="140" r="35" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Mic Capsule -->
  <rect x="185" y="90" width="30" height="65" rx="15" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
  <!-- Mesh top -->
  <path d="M 185 105 A 15 15 0 0 1 215 105 Z" fill="#334155"/>
  <circle cx="200" cy="125" r="4" fill="#8b5cf6"/>

  <!-- RGB Ring Indicator -->
  <ellipse cx="200" cy="150" rx="15" ry="4" fill="#a855f7"/>

  <!-- Recording waves -->
  <path d="M 130 140 C 130 110, 150 110, 150 140" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <path d="M 270 140 C 270 110, 250 110, 250 140" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>

  <text x="200" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">AURA STREAM STUDIO MIC</text>
</svg>
