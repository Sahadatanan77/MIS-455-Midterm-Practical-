<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="sptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#sptBg)"/>
  
  <!-- Running earhook headphones -->
  <g transform="translate(130, 80)">
    <!-- Behind neck flexible wire -->
    <path d="M 30 70 C 50 140, 90 140, 110 70" fill="none" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Left ear hook -->
    <path d="M 28 75 C 0 30, 30 5, 45 25" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="45" cy="40" r="14" fill="#0f172a" stroke="#f43f5e" stroke-width="3"/>
    
    <!-- Right ear hook -->
    <path d="M 112 75 C 140 30, 110 5, 95 25" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="40" r="14" fill="#0f172a" stroke="#f43f5e" stroke-width="3"/>

    <!-- In-line control button -->
    <rect x="98" y="90" width="10" height="24" rx="3" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  </g>

  <!-- Sweatproof IPX8 badge -->
  <g transform="translate(150, 220)">
    <rect width="100" height="26" rx="13" fill="#1e293b" stroke="#f43f5e" stroke-width="1"/>
    <text x="50" y="17" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#fda4af" text-anchor="middle">IPX8 SWEATPROOF</text>
  </g>

  <text x="200" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">AURA FIT ACTIVE SPORT</text>
</svg>
