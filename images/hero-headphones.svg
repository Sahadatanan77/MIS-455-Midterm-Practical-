<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#bgGrad)"/>
  <circle cx="300" cy="225" r="160" fill="url(#glowGrad)"/>

  <!-- Soundwave visualizer lines -->
  <g opacity="0.4">
    <path d="M 60 225 Q 120 170 180 225 T 300 225 T 420 225 T 540 225" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 6"/>
    <path d="M 80 225 Q 140 140 200 225 T 320 225 T 440 225 T 520 225" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Headband Arch -->
  <path d="M 190 240 C 180 120, 420 120, 410 240" fill="none" stroke="#475569" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 190 240 C 180 120, 420 120, 410 240" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Inner Cushion -->
  <path d="M 215 190 C 220 135, 380 135, 385 190" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>

  <!-- Left Ear Cup Assembly -->
  <g filter="url(#shadow)">
    <!-- Swivel joint -->
    <rect x="175" y="210" width="16" height="40" rx="8" fill="#64748b"/>
    <!-- Outer Cup -->
    <ellipse cx="180" cy="270" rx="42" ry="60" fill="url(#cupGrad)" stroke="#475569" stroke-width="4"/>
    <ellipse cx="180" cy="270" rx="30" ry="46" fill="#0f172a"/>
    <circle cx="180" cy="270" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="180" cy="270" r="4" fill="#06b6d4"/>
  </g>

  <!-- Right Ear Cup Assembly -->
  <g filter="url(#shadow)">
    <!-- Swivel joint -->
    <rect x="409" y="210" width="16" height="40" rx="8" fill="#64748b"/>
    <!-- Outer Cup -->
    <ellipse cx="420" cy="270" rx="42" ry="60" fill="url(#cupGrad)" stroke="#475569" stroke-width="4"/>
    <ellipse cx="420" cy="270" rx="30" ry="46" fill="#0f172a"/>
    <circle cx="420" cy="270" r="14" fill="none" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="420" cy="270" r="4" fill="#06b6d4"/>
  </g>

  <!-- Badge / Floating UI Elements -->
  <g transform="translate(60, 40)">
    <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#10b981"/>
    <text x="32" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">Hi-Res Audio</text>
  </g>
  <g transform="translate(420, 360)">
    <rect width="120" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">40dB ANC</text>
  </g>
</svg>
