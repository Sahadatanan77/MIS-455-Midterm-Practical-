<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ebCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#ebBg)"/>
  <circle cx="200" cy="160" r="100" fill="#10b981" opacity="0.08"/>

  <!-- Charging case open -->
  <rect x="130" y="140" width="140" height="90" rx="35" fill="url(#ebCase)" stroke="#475569" stroke-width="3"/>
  <line x1="130" y1="165" x2="270" y2="165" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>

  <!-- Left earbud -->
  <g transform="translate(160, 95)">
    <circle cx="15" cy="20" r="18" fill="#e2e8f0"/>
    <rect x="10" y="25" width="10" height="35" rx="5" fill="#cbd5e1"/>
    <circle cx="15" cy="20" r="6" fill="#06b6d4"/>
  </g>

  <!-- Right earbud -->
  <g transform="translate(210, 95)">
    <circle cx="15" cy="20" r="18" fill="#e2e8f0"/>
    <rect x="10" y="25" width="10" height="35" rx="5" fill="#cbd5e1"/>
    <circle cx="15" cy="20" r="6" fill="#06b6d4"/>
  </g>

  <!-- LED indicators -->
  <circle cx="185" cy="195" r="3" fill="#10b981"/>
  <circle cx="200" cy="195" r="3" fill="#10b981"/>
  <circle cx="215" cy="195" r="3" fill="#10b981"/>

  <text x="200" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">AURA BUDS PRO WIRELESS</text>
</svg>
