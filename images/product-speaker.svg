<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="spkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="16" fill="url(#spkBg)"/>
  
  <!-- Cylinder 360 Speaker -->
  <g transform="translate(140, 50)">
    <!-- Base shadow -->
    <ellipse cx="60" cy="180" rx="45" ry="12" fill="#020617" opacity="0.6"/>
    <!-- Body -->
    <rect x="15" y="40" width="90" height="140" rx="20" fill="url(#cylGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Acoustic fabric pattern lines -->
    <line x1="25" y1="65" x2="95" y2="65" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
    <line x1="25" y1="90" x2="95" y2="90" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
    <line x1="25" y1="115" x2="95" y2="115" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
    <line x1="25" y1="140" x2="95" y2="140" stroke="#bae6fd" stroke-width="1" opacity="0.5"/>
    
    <!-- Top Cap Control Pad -->
    <ellipse cx="60" cy="40" rx="45" ry="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Plus Minus Play icons -->
    <text x="40" y="44" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">-</text>
    <polygon points="58,37 58,47 67,42" fill="#38bdf8"/>
    <text x="75" y="44" font-family="sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">+</text>

    <!-- Hanging Lanyard / Strap -->
    <path d="M 60 25 C 60 10, 85 10, 85 25" fill="none" stroke="#f59e0b" stroke-width="4"/>
  </g>

  <!-- Sound pulse waves -->
  <circle cx="80" cy="140" r="25" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="80" cy="140" r="40" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>
  <circle cx="320" cy="140" r="25" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
  <circle cx="320" cy="140" r="40" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>

  <text x="200" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">AURA ROAM 360° WATERPROOF</text>
</svg>
