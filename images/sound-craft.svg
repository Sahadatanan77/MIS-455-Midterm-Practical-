<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#bg2)"/>

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="50" y1="50" x2="550" y2="50"/>
    <line x1="50" y1="125" x2="550" y2="125"/>
    <line x1="50" y1="200" x2="550" y2="200"/>
    <line x1="50" y1="275" x2="550" y2="275"/>
    <line x1="50" y1="350" x2="550" y2="350"/>
    <line x1="100" y1="50" x2="100" y2="390"/>
    <line x1="200" y1="50" x2="200" y2="390"/>
    <line x1="300" y1="50" x2="300" y2="390"/>
    <line x1="400" y1="50" x2="400" y2="390"/>
    <line x1="500" y1="50" x2="500" y2="390"/>
  </g>

  <!-- Acoustic diaphragm rings -->
  <circle cx="300" cy="220" r="140" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="220" r="110" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="300" cy="220" r="80" fill="#0f172a" stroke="url(#waveGrad)" stroke-width="4"/>
  <circle cx="300" cy="220" r="50" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="300" cy="220" r="22" fill="#06b6d4" filter="url(#glow)"/>

  <!-- Frequency Equalizer Bars -->
  <g transform="translate(110, 310)" fill="url(#waveGrad)">
    <rect x="0" y="30" width="8" height="40" rx="4"/>
    <rect x="18" y="15" width="8" height="55" rx="4"/>
    <rect x="36" y="40" width="8" height="30" rx="4"/>
    <rect x="54" y="5" width="8" height="65" rx="4"/>
    <rect x="72" y="22" width="8" height="48" rx="4"/>
    <rect x="90" y="35" width="8" height="35" rx="4"/>
    
    <rect x="290" y="35" width="8" height="35" rx="4"/>
    <rect x="308" y="20" width="8" height="50" rx="4"/>
    <rect x="326" y="5" width="8" height="65" rx="4"/>
    <rect x="344" y="18" width="8" height="52" rx="4"/>
    <rect x="362" y="38" width="8" height="32" rx="4"/>
    <rect x="380" y="28" width="8" height="42" rx="4"/>
  </g>

  <!-- Sine wave curves -->
  <path d="M 60 220 Q 120 120 180 220 T 300 220 T 420 220 T 540 220" fill="none" stroke="url(#waveGrad)" stroke-width="4" filter="url(#glow)"/>
  <path d="M 60 220 Q 120 290 180 220 T 300 220 T 420 220 T 540 220" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

  <text x="300" y="80" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">PRECISION BIO-CELLULOSE DRIVER</text>
  <text x="300" y="105" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">5Hz - 45,000Hz Ultra-Wide Acoustic Response</text>
</svg>
