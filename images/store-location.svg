<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="locBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" rx="20" fill="url(#locBg)"/>

  <!-- Stylized Map Grid -->
  <g stroke="#334155" stroke-width="2" opacity="0.6">
    <line x1="80" y1="60" x2="520" y2="60"/>
    <line x1="80" y1="140" x2="520" y2="140"/>
    <line x1="80" y1="220" x2="520" y2="220"/>
    <line x1="80" y1="300" x2="520" y2="300"/>
    <line x1="80" y1="380" x2="520" y2="380"/>

    <line x1="120" y1="40" x2="120" y2="410"/>
    <line x1="220" y1="40" x2="220" y2="410"/>
    <line x1="320" y1="40" x2="320" y2="410"/>
    <line x1="420" y1="40" x2="420" y2="410"/>
    <line x1="500" y1="40" x2="500" y2="410"/>
  </g>

  <!-- Stylized City Roads -->
  <path d="M 80 200 L 250 200 L 320 140 L 520 140" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <path d="M 80 200 L 250 200 L 320 140 L 520 140" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>

  <path d="M 320 40 L 320 410" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <path d="M 320 40 L 320 410" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- Store Landmark building -->
  <rect x="280" y="80" width="80" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="275,80 320,50 365,80" fill="#0284c7"/>
  <text x="320" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">AURA LAB</text>

  <!-- Big Pulse Location Pin -->
  <g transform="translate(320, 200)">
    <circle cx="0" cy="0" r="40" fill="#f43f5e" opacity="0.25"/>
    <circle cx="0" cy="0" r="24" fill="#f43f5e" opacity="0.45"/>
    <path d="M 0 -35 C -18 -35 -20 -15 0 10 C 20 -15 18 -35 0 -35 Z" fill="url(#pinGrad)" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="-20" r="6" fill="#fff"/>
  </g>

  <!-- Flagship experience info card -->
  <g transform="translate(70, 310)">
    <rect width="260" height="90" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Flagship Audio Experience Studio</text>
    <text x="20" y="54" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Plot 15, Block B, Aftabnagar</text>
    <text x="20" y="72" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8">Open Daily: 10:00 AM - 9:00 PM</text>
  </g>
</svg>
